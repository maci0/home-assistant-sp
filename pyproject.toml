[project]
name = "home-assistant-sp"
version = "1.7.0"
description = "Home Assistant custom integration for SP Group electricity, water, and gas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",   # builtin shadowing
    "B",   # bugbear
    "BLE", # blind except
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "ERA", # commented-out code
    "E",
    "F",
    "FA",  # future annotations
    "FLY", # f-strings in logging calls
    "G",   # logging format
    "I",
    "ICN", # import aliases
    "INT", # gettext
    "ISC", # implicit string concat
    "LOG", # logging misuse
    "N",   # pep8 naming
    "PD",  # pandas
    "PERF",
    "PIE",
    "PTH", # pathlib
    "Q",   # quotes
    "RET", # returns
    "RSE", # unnecessary parens on raise
    "RUF",
    "S",   # bandit
    "SIM", # simplifiable code
    "TID", # tidy imports
    "UP",
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
# Asserts are how a test states its expectation, the credentials are fixtures for
# the login path, and the fuzz corpus draws from a seeded Random so a run is
# reproducible. None of the three is a secret or a weak choice in production.
"tests/*.py" = ["S101", "S105", "S106", "S311"]
# The fuzz corpus is ambiguous digits on purpose: they are what the parser must survive.
"tests/test_fuzz.py" = ["RUF001"]
# Same for the fold and sensor-key tests: full-width codes and an en dash are
# the characters the folding and key rules have to keep apart.
"tests/test_mapper.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "custom_components",
    "scripts",
    "tests",
]

# Home Assistant and voluptuous ship no type information and are provided by
# the Home Assistant runtime, not installed here.
[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*"]
ignore_missing_imports = true

# The modules that import them subclass their entities and decorate methods
# with their callbacks, so those base classes and decorators are Any. Every
# other check still runs on those modules.
[[tool.mypy.overrides]]
module = "custom_components.sp_group.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
