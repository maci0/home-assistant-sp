[project]
name = "home-assistant-sp"
version = "1.7.0"
description = "Home Assistant custom integration for SP Group electricity, water, and gas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",   # builtin shadowing
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "ERA", # commented-out code
    "E",
    "F",
    "FA",  # future annotations
    "G",   # logging format
    "I",
    "ICN", # import aliases
    "INT", # gettext
    "ISC", # implicit string concat
    "LOG", # logging misuse
    "N",   # pep8 naming
    "PD",  # pandas
    "PERF",
    "PIE",
    "PTH", # pathlib
    "Q",   # quotes
    "RET", # returns
    "RUF",
    "TID", # tidy imports
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
# The fuzz corpus is ambiguous digits on purpose: they are what the parser must survive.
"tests/test_fuzz.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "custom_components",
    "scripts",
    "tests",
]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true
