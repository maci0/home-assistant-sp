[project]
name = "home-assistant-sp"
version = "1.6.1"
description = "Home Assistant custom integration for SP Group electricity, water, and gas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "custom_components/sp_group/client.py",
    "custom_components/sp_group/mapper.py",
    "custom_components/sp_group/const.py",
    "custom_components/sp_group/history.py",
    "custom_components/sp_group/models.py",
]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true
